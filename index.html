<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Together">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>A. Music Together</title>
<style>
  :root { --fg:#fff; --fg2:rgba(255,255,255,.62); --fg3:rgba(255,255,255,.35); --glass:rgba(255,255,255,.12); --accent:#0A84FF; --ok:#30D158; --warn:#FF9F0A; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg); font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif; overflow-x:hidden; }
  /* the player's background: the artwork, heavily blurred, drifting slowly, under a dark shade (as Modern flow) */
  .bg { position:fixed; inset:0; overflow:hidden; z-index:0; background:#000; }
  .bg i { position:absolute; left:50%; top:50%; width:150vmax; height:150vmax; margin:-75vmax 0 0 -75vmax; background:center/cover no-repeat; filter:blur(70px) saturate(1.7) brightness(.95); opacity:0; transition:opacity 1.4s ease, background-image 0s; will-change:transform; }
  .bg i.a { animation:drift1 38s ease-in-out infinite alternate; }
  .bg i.b { animation:drift2 52s ease-in-out infinite alternate; mix-blend-mode:screen; }
  .bg.on i.a { opacity:.85; } .bg.on i.b { opacity:.45; }
  @keyframes drift1 { from { transform:rotate(0) scale(1.05) translate(-4%,-3%); } to { transform:rotate(40deg) scale(1.25) translate(5%,4%); } }
  @keyframes drift2 { from { transform:rotate(180deg) scale(1.3) translate(6%,2%); } to { transform:rotate(120deg) scale(1.1) translate(-5%,-6%); } }
  .bg::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.2) 25%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.9) 85%,#000 100%); }
  .bg.idle::before { content:""; position:absolute; inset:-20%; background:radial-gradient(circle at 30% 25%,rgba(10,132,255,.35),transparent 45%),radial-gradient(circle at 75% 70%,rgba(94,92,230,.3),transparent 50%); animation:drift1 30s ease-in-out infinite alternate; }
  .wrap { position:relative; z-index:1; max-width:440px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
          padding:max(18px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left)); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; color:var(--fg2); }
  .brand img { width:28px; height:28px; border-radius:7px; }
  .pill { font:600 13px/1 ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:2px; padding:8px 11px; border-radius:999px; background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); color:var(--fg); }
  /* join */
  .hero { margin:auto 0; padding:36px 0 20px; }
  .glyph { width:84px; height:84px; border-radius:20px; display:block; margin:0 0 26px; box-shadow:0 14px 40px rgba(0,0,0,.6); }
  h1 { font-size:34px; font-weight:700; letter-spacing:-.6px; margin:0 0 6px; }
  .sub { color:var(--fg2); margin:0 0 26px; font-size:17px; }
  .glass { background:var(--glass); backdrop-filter:blur(30px) saturate(1.4); -webkit-backdrop-filter:blur(30px) saturate(1.4); border-radius:18px; padding:18px; }
  label { display:block; color:var(--fg2); font-size:12px; text-transform:uppercase; letter-spacing:.8px; margin-bottom:10px; }
  #code { width:100%; font:600 32px/1 ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:10px; text-align:center; text-transform:uppercase; background:rgba(0,0,0,.35); color:var(--fg); border:0; border-radius:12px; padding:16px 8px; outline:none; }
  #code::placeholder { color:var(--fg3); }
  #code:focus { box-shadow:0 0 0 2px var(--accent); }
  .btn { display:flex; align-items:center; justify-content:center; width:100%; border:0; border-radius:14px; padding:16px; font-weight:600; font-size:17px; font-family:inherit; line-height:1; color:#fff; background:var(--accent); margin-top:14px; cursor:pointer; }
  .btn:active { opacity:.75; }
  .hint { color:var(--fg2); font-size:14px; margin-top:14px; }
  /* now playing, laid out like the app's full player */
  .art { position:relative; width:100%; aspect-ratio:1; margin:26px auto 0; border-radius:12px; overflow:hidden; background:rgba(255,255,255,.08) center/cover no-repeat;
         box-shadow:0 24px 60px rgba(0,0,0,.55); transform:scale(1); transition:transform .55s cubic-bezier(.2,.9,.25,1.2), box-shadow .55s; }
  .art.paused { transform:scale(.82); box-shadow:0 10px 30px rgba(0,0,0,.45); }
  .art.yt { background-size:auto 133%; }
  .art .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .art .ph img { width:34%; opacity:.5; }
  .tap { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; border:0; border-radius:999px; padding:12px 18px; font-weight:600; font-size:16px; font-family:inherit; color:#fff; background:rgba(0,0,0,.55); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); cursor:pointer; animation:pulse 1.6s ease-in-out infinite; }
  .tap svg { width:20px; height:20px; }
  @keyframes pulse { 50% { transform:translateX(-50%) scale(1.06); } }
  .meta { margin-top:30px; min-height:58px; }
  .title { font-size:22px; font-weight:700; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .artist { color:var(--fg2); font-size:19px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { height:6px; background:rgba(255,255,255,.2); border-radius:3px; margin:20px 0 8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:rgba(255,255,255,.85); border-radius:3px; }
  .times { display:flex; justify-content:space-between; color:var(--fg2); font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; }
  .controls { display:flex; align-items:center; justify-content:space-evenly; margin:26px 0 10px; }
  .ctl { width:76px; height:76px; border:0; border-radius:50%; background:transparent; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s, background .15s; }
  .ctl:active { transform:scale(.86); background:rgba(255,255,255,.12); }
  .ctl svg { width:40px; height:40px; }
  .status { display:flex; justify-content:center; margin-top:8px; }
  .chip { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--fg2); background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:999px; padding:8px 13px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--warn); }
  .dot.ok { background:var(--ok); }
  .leave { background:none; border:0; color:var(--fg2); font:500 15px inherit; font-family:inherit; margin:18px auto 0; display:block; cursor:pointer; padding:8px 14px; }
  /* YouTube's player has to stay on screen to play (its rules): kept small, at the bottom */
  .yt { margin-top:22px; }
  .yt small { display:block; color:var(--fg3); font-size:12px; margin:0 0 8px 2px; }
  .ytbox { position:relative; width:100%; aspect-ratio:16/9; min-height:200px; border-radius:12px; overflow:hidden; background:#000; }
  .ytbox iframe, #yt { position:absolute; inset:0; width:100%; height:100%; border:0; }
  #toast { position:fixed; z-index:5; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:rgba(40,40,42,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); color:#fff; padding:12px 16px; border-radius:14px; font-size:15px; max-width:calc(100% - 32px); opacity:0; transition:.25s; pointer-events:none; text-align:center; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .foot { color:var(--fg3); font-size:12px; text-align:center; margin-top:auto; padding-top:24px; }
  [hidden] { display:none !important; }
  .float { position:fixed; z-index:4; font-size:38px; pointer-events:none; animation:up 1.7s ease-out forwards; }
  @keyframes up { from { opacity:1; transform:translateY(0) scale(.7); } to { opacity:0; transform:translateY(-260px) scale(1.35); } }
  @media (prefers-reduced-motion: reduce) { .bg i, .bg.idle::before { animation:none; } }
</style>
</head>
<body>
<div class="bg idle" id="bg"><i class="a" id="bga"></i><i class="b" id="bgb"></i></div>
<div class="wrap">
  <div class="top"><div class="brand"><img src="icon-180.png" alt="">A. Music</div><span class="pill" id="pill" hidden></span></div>

  <section id="join" class="hero">
    <img class="glyph" src="icon-512.png" alt="">
    <h1>Listen together</h1>
    <p class="sub">Join a friend who's hosting in A. Music and hear the same song at the same moment.</p>
    <div class="glass">
      <label for="code">Session code</label>
      <input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7MP2Q">
      <button class="btn" id="go">Join</button>
      <div class="hint">The code is on your friend's Listening together screen.</div>
    </div>
  </section>

  <section id="live" hidden>
    <div class="art paused" id="art"><div class="ph" id="ph"><img src="glyph.svg" alt=""></div><button class="tap" id="tap" hidden><svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>Tap for sound</button></div>
    <div class="meta"><div class="title" id="ti">Waiting for the host…</div><div class="artist" id="ar">&nbsp;</div></div>
    <div class="bar"><i id="pr"></i></div>
    <div class="times"><span id="t0">0:00</span><span id="t1">0:00</span></div>
    <div class="controls">
      <button class="ctl" id="nope" aria-label="Not for me"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="ctl" id="heart" aria-label="Love it"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.4 1.1 4.1 2.2h3C14.2 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></button>
    </div>
    <div class="status"><div class="chip"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div></div>
    <button class="leave" id="leave">Leave session</button>
    <div class="yt"><small>Playing from YouTube</small><div class="ytbox"><div id="yt"></div></div></div>
  </section>
  <div class="foot">Listening together · works with A. Music on Android</div>
</div>
<div id="toast"></div>
<script src="tg.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let ytp = null, ytReady = false, curId = '', toastT = 0;
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
const fmt = ms => { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// the player the protocol drives: YouTube's own embedded player
let soundOn = false;
const player = {
  get ready() { return ytReady; },
  id: () => curId,
  load(id, sec, play) {
    curId = id;
    if (!soundOn) ytp.mute();
    if (play) ytp.loadVideoById({ videoId: id, startSeconds: sec }); else ytp.cueVideoById({ videoId: id, startSeconds: sec });
  },
  play: () => ytp.playVideo(), pause: () => ytReady && ytp.pauseVideo(), seek: s => ytp.seekTo(s, true),
  time: () => ytReady && curId ? ytp.getCurrentTime() : -1,
  playing: () => ytReady && ytp.getPlayerState() === 1
};
// iPhone and most browsers only let a page make sound after a tap: the song starts muted, a tap turns the sound on
function unlock() {
  if (!ytReady) return;
  soundOn = true;
  try { ytp.unMute(); ytp.setVolume(100); if (TG.state().song.playing) ytp.playVideo(); } catch (e) {}
  setTimeout(checkSound, 600);
}
function checkSound() { const muted = !ytReady || ytp.isMuted(); if (!muted) soundOn = true; $('tap').hidden = !curId || !muted; }
window.onYouTubeIframeAPIReady = () => {
  ytp = new YT.Player('yt', { playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1, mute: 1, autoplay: 0 },
    events: { onReady: () => { ytReady = true; }, onStateChange: () => checkSound(),
              onError: e => { toast(e.data === 101 || e.data === 150 ? "This song can't play outside YouTube – waiting for the next one" : "The song didn't load"); } } });
};
function loadYT() { if (window.YT) return; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }

let lastArt = '';
function setArt(url) {
  if (url === lastArt) return; lastArt = url;
  const yt = /i\.ytimg\.com/.test(url), a = $('art');
  a.classList.toggle('yt', yt);
  a.style.backgroundImage = url ? 'url("' + url + '")' : '';
  $('ph').hidden = !!url;
  const bg = $('bg');
  ['bga', 'bgb'].forEach(i => $(i).style.backgroundImage = url ? 'url("' + url + '")' : '');
  bg.classList.toggle('on', !!url); bg.classList.toggle('idle', !url);
}
function draw() {
  const s = TG.state();
  if (!s.on) { $('live').hidden = true; $('join').hidden = false; $('pill').hidden = true; setArt(''); return; }
  const song = s.song, anyUp = s.up.some(x => x);
  setArt(song.id ? song.thumb : '');
  $('art').classList.toggle('paused', !(song.id && song.playing));
  if (ytReady) checkSound();
  $('ti').textContent = song.id ? song.title || 'Unknown song' : (s.host ? 'The host has nothing playing' : 'Waiting for the host…');
  $('ar').textContent = song.id ? song.artist || '' : '\u00a0';
  const pos = song.id ? s.exp : 0;
  $('pr').style.width = song.dur ? Math.min(100, pos / song.dur * 100) + '%' : '0';
  $('t0').textContent = fmt(pos); $('t1').textContent = song.dur ? '-' + fmt(song.dur - pos) : '0:00';
  let txt, ok = false;
  if (!anyUp) txt = 'Connecting…';
  else if (!s.host) txt = 'Looking for the host…';
  else if (!song.id) txt = 'With the host';
  else if (!song.playing) txt = 'Paused by the host';
  else if (Math.abs(s.drift) < 1500) { txt = 'In step with the host'; ok = true; }
  else txt = 'Catching up…';
  $('status').textContent = txt; $('dot').classList.toggle('ok', ok);
  document.title = song.id ? song.title + ' · Together' : 'A. Music Together';
  if ('mediaSession' in navigator && song.id) navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist, artwork: [{ src: song.thumb, sizes: '512x512' }] });
}
function burst(e) { const b = document.createElement('div'); b.className = 'float'; b.textContent = e; b.style.left = (20 + Math.random() * 60) + '%'; b.style.bottom = '120px'; document.body.appendChild(b); setTimeout(() => b.remove(), 1700); }
TG.onReaction = k => burst(k === 'heart' ? '❤️' : '✕');

loadYT();
$('code').value = (location.hash.slice(1) || '').toUpperCase();
$('code').addEventListener('input', e => { e.target.value = TG.clean(e.target.value); });
$('go').onclick = async () => {
  const code = TG.clean($('code').value);
  if (code.length < 4) { toast('Type the code from your friend’s phone'); return; }
  loadYT();
  $('join').hidden = true; $('live').hidden = false;
  try { await TG.join(code, player, draw, toast); $('pill').textContent = code; $('pill').hidden = false; try { history.replaceState(null, '', '#' + code); } catch (e) {} }
  catch (e) { toast('Couldn’t start – try again'); $('join').hidden = false; $('live').hidden = true; }
};
$('tap').onclick = e => { e.stopPropagation(); unlock(); };
document.addEventListener('touchend', () => { if (!soundOn && curId) unlock(); }, { passive: true });
document.addEventListener('click', () => { if (!soundOn && curId) unlock(); });
$('leave').onclick = () => { TG.leave(true); try { history.replaceState(null, '', location.pathname); } catch (e) {} draw(); };
$('heart').onclick = () => { TG.react('heart'); burst('❤️'); };

$('nope').onclick = () => { TG.react('nope'); burst('✕'); };
window.addEventListener('pagehide', () => TG.leave(true));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Together">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>A. Music Together</title>
<style>
  :root { --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fg:#fff; --fg2:rgba(255,255,255,.6); --line:rgba(255,255,255,.12); --accent:#0A84FF; --warn:#FF9F0A; --ok:#30D158; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif; }
  body { min-height:100vh; padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:34px; font-weight:700; letter-spacing:-.5px; margin:28px 0 4px; }
  .sub { color:var(--fg2); margin:0 0 24px; }
  .card { background:var(--card); border-radius:16px; padding:18px; }
  label { display:block; color:var(--fg2); font-size:13px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px; }
  #code { width:100%; font:600 34px/1 ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:10px; text-align:center; text-transform:uppercase; background:var(--card2); color:var(--fg); border:0; border-radius:12px; padding:16px 8px; outline:none; }
  #code:focus { box-shadow:0 0 0 2px var(--accent); }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; border-radius:14px; padding:15px; font-weight:600; font-size:17px; font-family:inherit; line-height:1; color:#fff; background:var(--accent); margin-top:14px; cursor:pointer; }
  .btn:active { opacity:.75; }
  .btn.ghost { background:var(--card2); color:var(--accent); }
  .hint { color:var(--fg2); font-size:14px; margin-top:14px; }
  .player { position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#111; }
  .player iframe, #yt { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .title { font-size:22px; font-weight:700; margin:16px 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .artist { color:var(--fg2); font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { height:4px; background:var(--line); border-radius:2px; margin:18px 0 6px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--fg); border-radius:2px; }
  .times { display:flex; justify-content:space-between; color:var(--fg2); font-size:12px; font-variant-numeric:tabular-nums; }
  .chip { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--fg2); background:var(--card2); border-radius:999px; padding:7px 12px; margin-top:16px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--warn); }
  .dot.ok { background:var(--ok); }
  .row { display:flex; gap:12px; margin-top:14px; }
  .round { flex:1; display:flex; align-items:center; justify-content:center; height:56px; border-radius:16px; border:0; background:var(--card2); color:var(--fg); cursor:pointer; }
  .round:active { transform:scale(.96); }
  .round svg { width:26px; height:26px; }
  #toast { position:fixed; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:rgba(44,44,46,.96); color:#fff; padding:12px 16px; border-radius:14px; font-size:15px; max-width:calc(100% - 32px); opacity:0; transition:.25s; pointer-events:none; text-align:center; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .foot { color:var(--fg2); font-size:12px; text-align:center; margin-top:28px; }
  [hidden] { display:none !important; }
  .float { position:fixed; font-size:34px; pointer-events:none; animation:up 1.6s ease-out forwards; }
  @keyframes up { from { opacity:1; transform:translateY(0) scale(.8); } to { opacity:0; transform:translateY(-220px) scale(1.3); } }
</style>
</head>
<body>
<div class="wrap">
  <section id="join">
    <h1>Listen together</h1>
    <p class="sub">Join a friend who's hosting in A. Music. You'll hear the same song at the same moment.</p>
    <div class="card">
      <label for="code">Session code</label>
      <input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="K7MP2Q">
      <button class="btn" id="go">Join</button>
      <div class="hint">Ask your friend for the code on their Listening together screen.</div>
    </div>
  </section>

  <section id="live" hidden>
    <h1>Listening together</h1>
    <div class="player"><div id="yt"></div></div>
    <div class="title" id="ti">Waiting for the host…</div>
    <div class="artist" id="ar">&nbsp;</div>
    <div class="bar"><i id="pr"></i></div>
    <div class="times"><span id="t0">0:00</span><span id="t1">0:00</span></div>
    <div class="chip"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
    <div class="row">
      <button class="round" id="heart" aria-label="Love it"><svg viewBox="0 0 24 24" fill="#FF375F"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.4 1.1 4.1 2.2h3C14.2 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></button>
      <button class="round" id="nope" aria-label="Not for me"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="btn ghost" id="leave">Leave</button>
  </section>
  <div class="foot">A. Music · Listening together · protocol 1</div>
</div>
<div id="toast"></div>
<script src="tg.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let ytp = null, ytReady = false, curId = '', toastT = 0;
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
const fmt = ms => { ms = Math.max(0, ms | 0); const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// the player the protocol drives: YouTube's own embedded player
const player = {
  get ready() { return ytReady; },
  id: () => curId,
  load(id, sec, play) { curId = id; if (play) ytp.loadVideoById({ videoId: id, startSeconds: sec }); else ytp.cueVideoById({ videoId: id, startSeconds: sec }); },
  play: () => ytp.playVideo(), pause: () => ytReady && ytp.pauseVideo(), seek: s => ytp.seekTo(s, true),
  time: () => ytReady && curId ? ytp.getCurrentTime() : -1,
  playing: () => ytReady && ytp.getPlayerState() === 1
};
window.onYouTubeIframeAPIReady = () => {
  ytp = new YT.Player('yt', { playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1 },
    events: { onReady: () => { ytReady = true; }, onError: e => { toast(e.data === 101 || e.data === 150 ? "This song can't play outside YouTube – waiting for the next one" : "The song didn't load"); } } });
};
function loadYT() { if (window.YT) return; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }

function draw() {
  const s = TG.state();
  if (!s.on) { $('live').hidden = true; $('join').hidden = false; return; }
  const song = s.song, anyUp = s.up.some(x => x);
  $('ti').textContent = song.id ? song.title || 'Unknown song' : (s.host ? 'The host has nothing playing' : 'Waiting for the host…');
  $('ar').textContent = song.id ? song.artist || '' : ' ';
  const pos = song.id ? s.exp : 0;
  $('pr').style.width = song.dur ? Math.min(100, pos / song.dur * 100) + '%' : '0';
  $('t0').textContent = fmt(pos); $('t1').textContent = song.dur ? '-' + fmt(song.dur - pos) : '0:00';
  let txt, ok = false;
  if (!anyUp) txt = 'Connecting…';
  else if (!s.host) txt = 'Looking for the host…';
  else if (!song.id) txt = 'With the host';
  else if (!song.playing) txt = 'Paused by the host';
  else if (Math.abs(s.drift) < 1500) { txt = 'In step with the host'; ok = true; }
  else txt = 'Catching up…';
  $('status').textContent = txt; $('dot').classList.toggle('ok', ok);
  document.title = song.id ? song.title + ' · Together' : 'A. Music Together';
  if ('mediaSession' in navigator && song.id) navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist, artwork: [{ src: song.thumb, sizes: '480x360' }] });
}
function burst(e) { const b = document.createElement('div'); b.className = 'float'; b.textContent = e; b.style.left = (20 + Math.random() * 60) + '%'; b.style.bottom = '120px'; document.body.appendChild(b); setTimeout(() => b.remove(), 1700); }
TG.onReaction = k => burst(k === 'heart' ? '❤️' : '✕');

$('code').value = (location.hash.slice(1) || '').toUpperCase();
$('code').addEventListener('input', e => { e.target.value = TG.clean(e.target.value); });
$('go').onclick = async () => {
  const code = TG.clean($('code').value);
  if (code.length < 4) { toast('Type the code from your friend’s phone'); return; }
  loadYT();
  $('join').hidden = true; $('live').hidden = false;
  try { await TG.join(code, player, draw, toast); try { history.replaceState(null, '', '#' + code); } catch (e) {} }
  catch (e) { toast('Couldn’t start – try again'); $('join').hidden = false; $('live').hidden = true; }
};
$('leave').onclick = () => { TG.leave(true); try { history.replaceState(null, '', location.pathname); } catch (e) {} draw(); };
$('heart').onclick = () => { TG.react('heart'); burst('❤️'); };
$('nope').onclick = () => { TG.react('nope'); burst('✕'); };
window.addEventListener('pagehide', () => TG.leave(true));
</script>
</body>
</html>
